
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Environment 02 - The Swamp Lands</title>
    <link href="env02.css" rel="stylesheet" type="text/css">
</head>

<body>

    <h1>The Swamp Lands</h1>

    <p id="introduction">
        Far away in a world full of rulers and servants, dragons and aliens,
        lies the gigglegoon, not much of a monster, not much of anything really,
        but such is this world where things matter and others do not.
    </p>

    <!-- Environmental zone: the swamp atmosphere -->
    <div id="top">

        <div id="moon"></div>

        <div id="mist"></div>

        <div id="swamp-plants">
            <span>♣</span>
            <span>♣</span>
            <span>♣</span>
        </div>

    </div>

    <!-- Main zone: the Gigglegoon and its surroundings -->
    <div id="main">

        <div id="left-rock" class="rock"></div>

        <div id="gigglegoon">
            <img src="gg.png" alt="A Gigglegoon resting in the swamp">
            <p>The Gigglegoon</p>
        </div>

        <div id="swamp-tree">
            <div class="tree-top"></div>
            <div class="tree-trunk"></div>
            <p>Swamp Tree</p>
        </div>

        <div id="right-rock" class="rock"></div>

    </div>

</body>
</html>
